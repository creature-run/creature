<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Pip</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Dark mode (default) */
    :root {
      --bg-card: #1F1E1D;
      --text: #ABABAB;
    }

    /* Light mode */
    :root.light {
      --bg-card: #EFEEEC;
      --text: #1F1E1D;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-card);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Standard MCP: iframe fills the window */
    .content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-card);
    }

    /* Browser mode: nav bar (40px) + webview (rest) */
    body.browser-mode .content {
      display: none;
    }

    .browser-container {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    body.browser-mode .browser-container {
      display: flex;
    }

    .browser-nav-frame {
      height: 40px;
      width: 100%;
      border: none;
      flex-shrink: 0;
      background: var(--bg-card);
    }

    .browser-webview {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: #ffffff;
    }

    .ui-error-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      color: var(--text);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
      z-index: 10;
    }

    .ui-error-overlay.visible {
      display: flex;
    }

    .ui-error-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .ui-error-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    :root.light .ui-error-copy {
      border-color: rgba(0, 0, 0, 0.1);
    }

    .ui-error-body {
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.9;
    }

    .ui-error-copy svg {
      width: 14px;
      height: 14px;
    }
  </style>
</head>
<body>
  <!-- Standard MCP content (hidden in browser mode) -->
  <div class="content">
    <iframe id="content-frame" srcdoc="<!DOCTYPE html><html><head></head><body></body></html>"></iframe>
  </div>

  <!-- Browser mode content (hidden by default) -->
  <div class="browser-container">
    <iframe id="browser-nav-frame" class="browser-nav-frame" srcdoc="<!DOCTYPE html><html><head></head><body></body></html>"></iframe>
    <webview id="browser-webview" class="browser-webview" src="about:blank" webpreferences="contextIsolation=yes, nodeIntegration=no"></webview>
  </div>

  <div id="ui-error-overlay" class="ui-error-overlay" aria-live="polite">
    <div class="ui-error-header">
      <span>UI Error</span>
      <button id="ui-error-copy" class="ui-error-copy" type="button">
        <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false">
          <rect x="40" y="72" width="144" height="144" rx="8" fill="none" stroke="currentColor" stroke-width="16"></rect>
          <path d="M72 40h112a8 8 0 0 1 8 8v112" fill="none" stroke="currentColor" stroke-width="16"></path>
        </svg>
        Copy
      </button>
    </div>
    <div id="ui-error-body" class="ui-error-body"></div>
  </div>

  <!-- Bundled AppBridge integration script -->
  <script src="./popout-mcp-bridge.js"></script>

  <script>
    // Apply theme from URL params
    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme');
    if (theme === 'light') {
      document.documentElement.classList.add('light');
    }

    // Set window title from URL params
    const title = params.get('title');
    if (title) {
      document.title = decodeURIComponent(title);
    }
  </script>
</body>
</html>
